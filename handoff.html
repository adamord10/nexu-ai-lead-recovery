<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Revisión de Escalación · Nexu Lead Rescue Copilot</title>
<meta name="description" content="Revisión de escalación: contexto, pitch recomendado por IA, análisis de objeciones y asesor asignado.">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: {"primary":"#4648d4","primary-container":"#6063ee","primary-fixed":"#e1e0ff","primary-fixed-dim":"#c0c1ff","on-primary":"#ffffff","on-primary-fixed":"#07006c","on-primary-fixed-variant":"#2f2ebe","on-primary-container":"#fffbff","secondary":"#565e74","secondary-container":"#dae2fd","secondary-fixed":"#dae2fd","secondary-fixed-dim":"#bec6e0","on-secondary":"#ffffff","on-secondary-container":"#5c647a","on-secondary-fixed":"#131b2e","on-secondary-fixed-variant":"#3f465c","tertiary":"#006c49","tertiary-container":"#00885d","tertiary-fixed":"#6ffbbe","tertiary-fixed-dim":"#4edea3","on-tertiary":"#ffffff","on-tertiary-container":"#000703","on-tertiary-fixed":"#002113","on-tertiary-fixed-variant":"#005236","error":"#ba1a1a","error-container":"#ffdad6","on-error":"#ffffff","on-error-container":"#93000a","surface":"#f7f9fb","surface-bright":"#f7f9fb","surface-dim":"#d8dadc","surface-variant":"#e0e3e5","surface-tint":"#494bd6","surface-container":"#eceef0","surface-container-low":"#f2f4f6","surface-container-lowest":"#ffffff","surface-container-high":"#e6e8ea","surface-container-highest":"#e0e3e5","background":"#f7f9fb","on-background":"#191c1e","on-surface":"#191c1e","on-surface-variant":"#464554","outline":"#767586","outline-variant":"#c7c4d7","inverse-surface":"#2d3133","inverse-on-surface":"#eff1f3","inverse-primary":"#c0c1ff"},
    borderRadius: { DEFAULT:"0.25rem", lg:"0.5rem", xl:"0.75rem", full:"9999px" },
    spacing: { container_padding:"2rem", sidebar_width:"240px", stack_md:"1rem", gutter:"1.5rem", header_height:"64px", stack_sm:"0.5rem" },
    fontFamily: { "body-compact":["Geist"], "display":["Geist"], "data-mono":["JetBrains Mono"], "headline-section":["Geist"], "label-caps":["Geist"], "body-main":["Geist"] },
    fontSize: {"body-compact":["13px",{lineHeight:"18px",fontWeight:"400"}],"display":["32px",{lineHeight:"40px",letterSpacing:"-0.02em",fontWeight:"700"}],"data-mono":["12px",{lineHeight:"16px",fontWeight:"500"}],"headline-section":["20px",{lineHeight:"28px",letterSpacing:"-0.01em",fontWeight:"600"}],"label-caps":["11px",{lineHeight:"16px",letterSpacing:"0.05em",fontWeight:"600"}],"body-main":["14px",{lineHeight:"20px",fontWeight:"400"}]}
  }}
}
</script>
<style>
.material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
.icon-fill { font-variation-settings:'FILL' 1; }
@keyframes shimmer { 100% { transform: translateX(100%); } }
</style>
</head>
<body class="bg-background text-on-surface font-body-main min-h-screen">

<aside class="w-[240px] h-screen fixed left-0 top-0 bg-surface border-r border-outline-variant flex flex-col py-6 px-4 z-20">
  <div class="mb-8 px-2"><h1 class="font-display text-display font-bold text-primary tracking-tight">Nexu TEAM</h1><p class="font-body-compact text-body-compact text-on-surface-variant mt-1">Lead Rescue Copilot</p></div>
  <nav class="flex flex-col gap-1 font-body-main text-body-main">
    <a class="flex items-center gap-3 px-3 py-2.5 rounded text-on-surface-variant font-medium hover:bg-surface-container-high transition-colors group" href="index.html"><span class="material-symbols-outlined text-[20px] group-hover:text-primary">queue_play_next</span>Recovery Dashboard</a>
    <a class="flex items-center gap-3 px-3 py-2.5 rounded text-on-surface-variant font-medium hover:bg-surface-container-high transition-colors group" href="orchestration.html"><span class="material-symbols-outlined text-[20px] group-hover:text-primary">schema</span>Flujo de Orquestación</a>
    <a class="flex items-center gap-3 px-3 py-2.5 rounded text-on-surface-variant font-medium hover:bg-surface-container-high transition-colors group" href="conversations.html"><span class="material-symbols-outlined text-[20px] group-hover:text-primary">forum</span>Conversaciones IA</a>
    <a class="flex items-center gap-3 px-3 py-2.5 rounded text-primary font-bold border-r-2 border-primary bg-surface-container-low" href="escalations.html"><span class="material-symbols-outlined icon-fill text-[20px] text-primary">support_agent</span>Escalaciones</a>
    <a class="flex items-center gap-3 px-3 py-2.5 rounded text-on-surface-variant font-medium hover:bg-surface-container-high transition-colors group" href="analytics.html"><span class="material-symbols-outlined text-[20px] group-hover:text-primary">analytics</span>Analítica</a>
    <div class="flex-grow"></div>
    <a class="flex items-center gap-3 px-3 py-2.5 rounded text-on-surface-variant font-medium hover:bg-surface-container-high transition-colors group mt-auto" href="settings.html"><span class="material-symbols-outlined text-[20px] group-hover:text-primary">settings</span>Configuración</a>
  </nav>
</aside>

<div class="ml-[240px] flex flex-col min-h-screen">
  <header class="h-header_height fixed top-0 z-10 border-b border-outline-variant shadow-sm bg-surface-bright flex justify-between items-center px-6 ml-[240px] w-[calc(100%-240px)]">
    <div class="flex-1 max-w-md relative">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-on-surface-variant">search</span>
      <input class="pl-9 pr-4 py-1.5 w-full bg-surface-container border border-outline-variant/50 rounded font-body-compact text-body-compact text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="Buscar cola, ID o asesor..." type="text">
    </div>
    <div class="flex items-center gap-2">
      <button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container"><span class="material-symbols-outlined">notifications</span></button>
      <div class="w-8 h-8 rounded-full bg-primary/10 text-primary font-data-mono flex items-center justify-center border border-primary/20 ml-2">JA</div>
    </div>
  </header>

  <main class="mt-[64px] p-container_padding">
    <div class="mb-gutter flex justify-between items-end">
      <div>
        <div class="flex items-center gap-2 text-on-surface-variant mb-2">
          <a href="escalations.html" class="font-body-compact text-body-compact hover:text-primary flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">arrow_back</span>Cola de Escalaciones</a>
          <span class="material-symbols-outlined text-[16px]">chevron_right</span>
          <span class="font-body-compact text-body-compact text-on-surface" id="bc-status">…</span>
        </div>
        <h2 class="font-display text-display text-on-surface">Revisión de Escalación</h2>
      </div>
      <div class="font-data-mono text-data-mono text-on-surface-variant border border-outline-variant rounded px-2 py-1 bg-surface-container-lowest" id="esc-id-pill">ESC-ID: —</div>
    </div>

    <div id="esc-card-wrap">
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-12 text-center">
        <p class="font-body-main text-body-main text-on-surface-variant">Cargando escalación…</p>
      </div>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const id = params.get("id") || "8839-AX";
  const wrap = document.getElementById("esc-card-wrap");

  const { escalation, lead } = await NexuData.getEscalationWithLead(id);

  if (!escalation || !lead) {
    wrap.innerHTML = `
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-12 text-center">
        <p class="font-headline-section text-headline-section text-on-surface">Escalación no encontrada</p>
        <p class="font-body-compact text-body-compact text-on-surface-variant mt-2">ESC-ID: <code class="font-data-mono">${id}</code></p>
        <a href="escalations.html" class="inline-block mt-4 px-4 py-2 bg-primary text-on-primary rounded font-body-compact text-body-compact">Volver a la cola</a>
      </div>`;
    return;
  }

  document.title = `${lead.name} — Escalación · Nexu Lead Rescue Copilot`;
  document.getElementById("bc-status").textContent = escalation.status.label;
  document.getElementById("esc-id-pill").textContent = `ESC-ID: #${escalation.id}`;

  const accentByPriority = {
    critical: "bg-error",
    high:     "bg-primary",
    medium:   "bg-secondary",
    low:      "bg-outline-variant"
  };
  const accent = accentByPriority[escalation.priority] || "bg-primary";

  const statusBadge = {
    urgent:    { cls: "bg-error-container text-on-error-container border-error/30",  dot: "bg-error animate-pulse" },
    in_review: { cls: "bg-primary/10 text-primary border-primary/20",                dot: "bg-primary animate-pulse" },
    pending:   { cls: "bg-surface-container-high text-on-surface-variant border-outline-variant/50", dot: "bg-outline" },
    accepted:  { cls: "bg-tertiary/10 text-tertiary border-tertiary/30",             dot: "bg-tertiary" }
  }[escalation.status.key] || { cls: "bg-secondary-container text-on-secondary-container border-outline-variant/30", dot: "bg-primary" };

  const assignedBlock = escalation.assignedTo ? `
    <div class="flex items-center gap-3 p-3 rounded-lg border border-outline-variant bg-surface">
      <div class="w-10 h-10 rounded-full bg-primary/10 text-primary font-data-mono flex items-center justify-center border border-primary/20">${escalation.assignedTo.initials}</div>
      <div class="flex-1">
        <p class="font-body-main text-body-main font-semibold text-on-surface">${escalation.assignedTo.name}</p>
        <p class="font-body-compact text-body-compact text-on-surface-variant">${escalation.assignedTo.role}</p>
      </div>
      <button class="text-primary text-body-compact font-body-compact hover:underline">Cambiar</button>
    </div>` : `
    <div class="flex items-center gap-3 p-3 rounded-lg border border-error/30 bg-error-container/20">
      <div class="w-10 h-10 rounded-full bg-error/10 text-error flex items-center justify-center border border-error/20"><span class="material-symbols-outlined">priority_high</span></div>
      <div class="flex-1">
        <p class="font-body-main text-body-main font-semibold text-error">Sin asesor asignado</p>
        <p class="font-body-compact text-body-compact text-on-surface-variant">Triage inmediato requerido</p>
      </div>
      <button class="px-3 py-1 bg-primary text-on-primary rounded text-body-compact font-body-compact font-medium hover:bg-primary-container">Asignar</button>
    </div>`;

  const accentBorder = escalation.priority === "critical" ? "border-error" : "border-outline-variant";
  const objectionBorder = escalation.priority === "critical" ? "border-error" : "border-error";

  wrap.innerHTML = `
    <div class="bg-surface-container-lowest border ${accentBorder} rounded-xl p-6 shadow-[0_4px_12px_rgba(0,0,0,0.03)] relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-1 ${accent}"></div>

      <!-- Alert header -->
      <div class="flex items-start gap-4 mb-8">
        <div class="w-12 h-12 rounded-lg bg-primary-container flex items-center justify-center text-on-primary-container shrink-0 relative">
          <span class="material-symbols-outlined text-[28px]">${escalation.priority === "critical" ? "priority_high" : "trending_up"}</span>
          <span class="absolute -top-1 -right-1 w-3.5 h-3.5 ${escalation.priority === "critical" ? "bg-error" : "bg-tertiary-fixed"} rounded-full border-2 border-surface-container-lowest animate-pulse"></span>
        </div>
        <div class="flex-grow">
          <h3 class="font-headline-section text-headline-section text-on-surface text-[24px]">${escalation.headline}</h3>
          <p class="font-body-main text-body-main text-on-surface-variant mt-1">${escalation.subhead}</p>
        </div>
        <div class="shrink-0">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full ${statusBadge.cls} border font-label-caps text-label-caps uppercase">
            <span class="w-1.5 h-1.5 rounded-full ${statusBadge.dot}"></span>${escalation.status.label}
          </span>
        </div>
      </div>

      <!-- Bento grid -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Left: context + pitch -->
        <div class="lg:col-span-8 space-y-6">
          <div class="bg-surface rounded-lg border border-outline-variant p-5">
            <h4 class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-3 flex items-center gap-2">
              <span class="material-symbols-outlined text-[16px]">history</span>RESUMEN DE CONTEXTO
            </h4>
            <p class="font-body-main text-body-main leading-relaxed">${escalation.contextSummary}</p>
            <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-3 border-t border-outline-variant/40 pt-4">
              <div><p class="font-label-caps text-label-caps text-on-surface-variant uppercase">Cliente</p><p class="font-body-compact text-body-compact text-on-surface font-medium mt-0.5">${lead.name}</p></div>
              <div><p class="font-label-caps text-label-caps text-on-surface-variant uppercase">Vehículo</p><p class="font-body-compact text-body-compact text-on-surface font-medium mt-0.5">${lead.vehicle.year} ${lead.vehicle.make} ${lead.vehicle.model}</p></div>
              <div><p class="font-label-caps text-label-caps text-on-surface-variant uppercase">Score</p><p class="font-data-mono text-data-mono text-primary font-bold mt-0.5">${lead.score}/100</p></div>
              <div><p class="font-label-caps text-label-caps text-on-surface-variant uppercase">Creado</p><p class="font-body-compact text-body-compact text-on-surface font-medium mt-0.5">${escalation.createdAt}</p></div>
            </div>
          </div>

          <div class="bg-inverse-surface rounded-lg border border-outline p-6 relative overflow-hidden group">
            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-inverse-on-surface/5 to-transparent -translate-x-full group-hover:animate-[shimmer_2.5s_infinite]"></div>
            <div class="flex items-center justify-between mb-4 relative z-10">
              <h4 class="font-label-caps text-label-caps text-inverse-on-surface uppercase flex items-center gap-2">
                <span class="material-symbols-outlined text-[16px] text-tertiary-fixed">smart_toy</span>PITCH RECOMENDADO POR IA
              </h4>
              <button class="text-inverse-on-surface hover:text-white transition-colors" title="Copiar" onclick="navigator.clipboard.writeText(this.parentElement.nextElementSibling.textContent)"><span class="material-symbols-outlined text-[18px]">content_copy</span></button>
            </div>
            <div class="font-body-main text-body-main text-white/90 leading-relaxed relative z-10 border-l-2 border-tertiary-fixed pl-4">
              ${escalation.recommendedPitch}
            </div>
          </div>
        </div>

        <!-- Right: assigned + objection -->
        <div class="lg:col-span-4 space-y-6 flex flex-col">
          <div>
            <h4 class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-2">ASESOR ASIGNADO</h4>
            ${assignedBlock}
          </div>

          <div class="flex-grow bg-surface-container-lowest rounded-lg border ${objectionBorder} p-5 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1 h-full bg-error"></div>
            <h4 class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-3 flex items-center gap-2">
              <span class="material-symbols-outlined text-[16px] text-error">gavel</span>ANÁLISIS DE OBJECIONES
            </h4>
            <div class="space-y-2">
              <h5 class="font-headline-section text-headline-section text-on-surface text-[18px]">${escalation.objection.title}</h5>
              <p class="font-body-compact text-body-compact text-on-surface-variant">${escalation.objection.body}</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="mt-8 pt-6 border-t border-outline-variant flex justify-between items-center">
        <div class="flex items-center gap-4">
          <a href="conversation.html?id=${lead.id}" class="text-primary font-body-compact text-body-compact hover:underline flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">chat</span>Ver conversación</a>
          <a href="lead-${lead.id}.html" class="text-primary font-body-compact text-body-compact hover:underline flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">person</span>Perfil del lead</a>
        </div>
        <div class="flex items-center gap-3">
          <button class="px-4 py-2 border border-outline-variant rounded bg-surface-container-lowest hover:bg-surface-container font-body-compact text-body-compact text-on-surface">Posponer</button>
          <button class="bg-primary text-on-primary font-body-main text-body-main font-semibold py-2.5 px-6 rounded-lg hover:bg-primary-container transition-colors shadow-sm flex items-center gap-2"><span class="material-symbols-outlined text-[20px]">pan_tool</span>Aceptar y Tomar Control</button>
        </div>
      </div>
    </div>
  `;
})();
</script>
</body>
</html>
